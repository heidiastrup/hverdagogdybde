<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Hjemmeside</title>
    <style>
        /* Grundlæggende styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            padding: 40px 20px;
            min-height: 400px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Velkommen til Min Hjemmeside</h1>
        <nav>
            <a href="#">Forside</a>
            <a href="#">Om Os</a>
            <a href="#">Kontakt</a>
        </nav>
    </header>

    <!-- Hovedindhold -->
    <main>
        <h2>Her kommer dit indhold</h2>
        <p>Indsæt alt det, du har lyst til her – tekst, billeder, formularer, videoer osv.</p>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Min Hjemmeside. Alle rettigheder forbeholdes.</p>
    </footer>

</body>
</html>
