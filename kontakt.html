<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hverdag og dybde – Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>hverdag og dybde</h1>
        <nav>
            <a href="index.html">Forside</a>
            <a href="om.html">Om mig</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </header>

    <!-- Kontakt -->
    <main>
        <section class="kontakt-form">
            <h2>Kontakt</h2>
            <form>
                <label for="navn">Navn</label>
                <input type="text" id="navn" name="navn" placeholder="Dit navn" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Din e-mail" required>

                <label for="besked">Besked</label>
                <textarea id="besked" name="besked" rows="5" placeholder="Skriv din besked her..." required></textarea>

                <button type="submit">Send besked</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 hverdag og dybde – Psykoterapi ved psykoterapeut MPF Heidi Astrup Petersen. Alle rettigheder forbeholdes.</p>
    </footer>

</body>
</html>
