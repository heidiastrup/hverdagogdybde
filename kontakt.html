<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt – hverdag og dybde</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="navbar">
    <a href="forside.html" class="logo">hverdag og dybde</a>
    <nav>
      <ul>
        <li><a href="forside.html">Forside</a></li>
        <li><a href="om.html">Min praksis</a></li>
        <li><a href="priser.html">Priser</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
    <div class="burger" id="burger"><span></span><span></span><span></span></div>
  </div>
</header>

<section>
  <h2 style="text-align:center;font-family:var(--serif);">Kontakt</h2>

  <form action="https://formspree.io/f/XXXXXXXX" method="POST">
    <input type="text" name="name" placeholder="Dit navn" required>
    <input type="email" name="email" placeholder="Din e-mail" required>
    <textarea name="message" rows="6" placeholder="Din besked" required></textarea>

    <p style="font-size:14px;">
      Ved at sende formularen accepterer du, at dine oplysninger bruges til at kontakte dig.
    </p>

    <button type="submit">Send besked</button>
  </form>
</section>

<footer>
  © 2025 hverdag og dybde
</footer>

<script>
const burger=document.getElementById("burger");
const mobile=document.querySelector(".nav-mobile");
burger?.addEventListener("click",()=>mobile.classList.toggle("active"));
</script>

</body>
</html>
