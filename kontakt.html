<body>

<div class="container">

<div class="hero-photo" style="height:330px; background-image:url('billeder/IMG_2439.jpg'); margin-bottom:30px;"></div>

<div class="card">
  <h2>kontakt</h2>

  <p>Skriv gerne til mig med spørgsmål eller booking af tid.</p>

  <form action="https://formspree.io/f/your-id" method="POST">
    <label>navn</label>
    <input type="text" name="name" required>

    <label>email</label>
    <input type="email" name="email" required>

    <label>besked</label>
    <textarea name="message" rows="5" required></textarea>

    <button type="submit">send besked</button>
  </form>
</div>

</div>

function toggleMenu(){
  const nav = document.querySelector('.mobile-nav');
  nav.style.display = (nav.style.display === 'flex') ? 'none' : 'flex';
}
</script>
